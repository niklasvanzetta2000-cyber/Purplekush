name: PurpleKush-EliteMobs
version: '${version}'
main: de.purplekush.elitemobs.PurpleKushEliteMobs
api-version: '26.3'
author: PurpleKush
description: Bessere Monster in der Nacht mit Rüstung, Waffen und leuchtenden Partikeln.

commands:
  elitemobs:
    description: Verwaltung von PurpleKush-EliteMobs
    usage: /<command> <reload|spawn [Monstertyp]>
    aliases: [elite]
    permission: purplekush.elitemobs.admin

permissions:
  purplekush.elitemobs.admin:
    description: Darf Config neu laden und Elite-Monster testweise spawnen.
    default: op
